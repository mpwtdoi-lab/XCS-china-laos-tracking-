<!DOCTYPE html>
<html lang="lo">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ຕິດຕາມພັດສະດຸ ຈີນ - ລາວ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans Lao', sans-serif;
            background-color: #f4f6f9;
            padding-top: 50px;
        }
        .card-custom {
            border: none;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }
        .btn-search {
            background-color: #0d6efd;
            border: none;
            padding: 10px 24px;
            font-weight: 600;
        }
        .timeline-item {
            border-left: 2px solid #0d6efd;
            padding-left: 15px;
            margin-bottom: 15px;
            position: relative;
        }
        .timeline-item::before {
            content: '';
            width: 10px;
            height: 10px;
            background: #0d6efd;
            border-radius: 50%;
            position: absolute;
            left: -6px;
            top: 5px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-7">
            <div class="card card-custom p-4">
                <h3 class="text-center text-primary mb-3 fw-bold">ຕິດຕາມພັດສະດຸ ຈີນ - ລາວ</h3>
                <p class="text-center text-muted mb-4">ກວດກາສະຖານະເຄື່ອງຂອງທ່ານໄດ້ງ່າຍໆ ຢູ່ທີ່ນີ້</p>
                
                <div class="input-group mb-3">
                    <input type="text" id="waybillInput" class="form-control form-control-lg" placeholder="ປ້ອນເລກຕິດຕາມພັດສະດຸ..." value="79120409198046">
                    <button class="btn btn-primary btn-search" onclick="trackPackage()">ຄົ້ນຫາ</button>
                </div>

                <!-- Loading State -->
                <div id="loading" class="text-center d-none my-4">
                    <div class="spinner-border text-primary" role="status"></div>
                    <p class="mt-2 text-muted">ກຳລັງຄົ້ນຫາຂໍ້ມູນ...</p>
                </div>

                <!-- Error State -->
                <div id="errorAlert" class="alert alert-danger d-none my-3"></div>

                <!-- Result Area -->
                <div id="resultArea" class="mt-4 d-none">
                    <h5 class="fw-bold mb-3">ສະຖານະພັດສະດຸ:</h5>
                    <div id="timelineContainer"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
async function trackPackage() {
    const waybillNo = document.getElementById('waybillInput').value.trim();
    const loading = document.getElementById('loading');
    const errorAlert = document.getElementById('errorAlert');
    const resultArea = document.getElementById('resultArea');
    const timelineContainer = document.getElementById('timelineContainer');

    if (!waybillNo) {
        alert('ກະລຸນາປ້ອນເລກຕິດຕາມພັດສະດຸ');
        return;
    }

    // Reset Display
    loading.classList.remove('d-none');
    errorAlert.classList.add('d-none');
    resultArea.classList.add('d-none');
    timelineContainer.innerHTML = '';

    try {
        // ยิงไปที่ Express Backend Proxy ที่สร้างไว้
        const response = await fetch(`/api/track/${waybillNo}`);
        const data = await response.json();

        loading.classList.add('d-none');

        if (!response.ok || !data) {
            throw new Error(data.message || 'ບໍ່ພົບຂໍ້ມູນພັດສະດຸນີ້');
        }

        // แสดงผล
        resultArea.classList.remove('d-none');
        
        if (Array.isArray(data) && data.length > 0) {
            data.forEach(item => {
                const div = document.createElement('div');
                div.className = 'timeline-item';
                div.innerHTML = `
                    <div class="fw-bold text-dark">${item.context || item.status || 'ອັບເດດສະຖານະ'}</div>
                    <small class="text-muted">${item.time || item.ftime || ''}</small>
                `;
                timelineContainer.appendChild(div);
            });
        } else {
            timelineContainer.innerHTML = `<div class="alert alert-info">ພົບຂໍ້ມູນພັດສະດຸ ແຕ່ບໍ່ມີປະວັດການຂົນສົ່ງ</div>`;
        }

    } catch (err) {
        loading.classList.add('d-none');
        errorAlert.classList.remove('d-none');
        errorAlert.innerText = err.message || 'ເກີດຂໍ້ຜິດພາດໃນການດຶງຂໍ້ມູນ';
    }
}
</script>

</body>
</html>
