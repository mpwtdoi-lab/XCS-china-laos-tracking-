<script>
    async function trackPackage() {
        const trackNo = document.getElementById('trackNo').value.trim();
        const resultBox = document.getElementById('resultBox');
        const statusContent = document.getElementById('statusContent');
        const loading = document.getElementById('loading');

        if (!trackNo) {
            alert('ກະລຸນາປ້ອນເລກພັດສະດຸ');
            return;
        }

        resultBox.style.display = 'none';
        loading.style.display = 'block';

        try {
            const response = await fetch(`/api/track/${trackNo}`);
            const result = await response.json();

            loading.style.display = 'none';
            resultBox.style.display = 'block';

            if (result.success && result.data) {
                const rawData = result.data;
                let logs = [];

                // ดึงข้อมูล timeline จากโครงสร้าง JSON ของ 0x26.cn
                if (rawData.data && rawData.data.log_list) {
                    logs = rawData.data.log_list;
                } else if (rawData.data && Array.isArray(rawData.data)) {
                    logs = rawData.data;
                } else if (Array.isArray(rawData)) {
                    logs = rawData;
                }

                if (logs.length > 0) {
                    let html = '<div class="timeline">';
                    logs.forEach(item => {
                        // รองรับ field time และ context หลายรูปแบบ
                        const time = item.create_time || item.time || item.date || item.created_at || '';
                        const desc = item.context || item.desc || item.status || item.content || item.log_type_name || JSON.stringify(item);
                        
                        html += `
                            <div class="timeline-item">
                                <div class="timeline-time">${time}</div>
                                <div class="timeline-desc">${desc}</div>
                            </div>
                        `;
                    });
                    html += '</div>';
                    statusContent.innerHTML = html;
                } else {
                    // กรณีไม่มี log แสดงสถานะปัจจุบัน (ถ้ามี)
                    const currentStatus = rawData.data?.status_name || rawData.data?.order_status || 'ບໍ່ພົບປະຫວັດການຂົນສົ່ງ';
                    statusContent.innerHTML = `<p style="padding: 10px; color: #555;">${currentStatus}</p>`;
                }
            } else {
                statusContent.innerHTML = 'ບໍ່ພົບຂໍ້ມູນພັດສະດຸหมายเลขนี้';
            }
        } catch (error) {
            loading.style.display = 'none';
            resultBox.style.display = 'block';
            statusContent.innerHTML = 'เกิดข้อผิดพลาดในการเชื่อมต่อเซิร์ฟเวอร์';
            console.error(error);
        }
    }
</script>
